name: CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: zooombooom/diplom

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./app
          file: ./app/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy:
    name: Deploy to Ubuntu VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Deploy application over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e

            mkdir -p "$HOME/diplom"
            cd "$HOME/diplom"

            cat > compose.yaml <<'COMPOSE'
            services:
              web:
                image: zooombooom/diplom:latest
                container_name: diplom-web
                ports:
                  - "8080:80"
                restart: unless-stopped
            COMPOSE

            docker compose pull
            docker rm -f diplom-web 2>/dev/null || true
            docker compose up -d --remove-orphans
            docker image prune -f

            sleep 5
            curl --fail --silent --show-error http://localhost:8080
